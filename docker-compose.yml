version: "3.8"

# Default project name is the parent dir ("server"); see foodie/server — must differ to avoid sharing the same Compose project + service "api".
name: 4ksports-server

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV}
        - PORT=${PORT}
        - DATABASE=${DATABASE}
        - DATABASE_PASSWORD=${DATABASE_PASSWORD}
        - JWT_SECRET=${JWT_SECRET}
        - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
        - SPORTS_API_TOKEN=${SPORTS_API_TOKEN}
        - EMAIL_TO=${EMAIL_TO}
        - EMAIL_FROM=${EMAIL_FROM}
        - EMAIL_HOST=${EMAIL_HOST}
        - EMAIL_ADDRESS=${EMAIL_ADDRESS}
        - EMAIL_PASSWORD=${EMAIL_PASSWORD}
        - COMPANY_NAME=${COMPANY_NAME}
    container_name: 4ksports-server
    ports:
      - "4700:4700"
    environment:
      NODE_ENV: production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - 4ksports-network

networks:
  4ksports-network:
    driver: bridge
